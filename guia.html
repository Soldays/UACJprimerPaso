<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal UACJ - Guía de ingreso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-gray-50">

  <div id="header"></div>

  <main class="p-8 max-w-5xl mx-auto w-full">

    <div class="text-sm text-gray-400 mb-4">Inicio > Guía de ingreso</div>

    <h2 class="text-3xl font-bold text-blue-900 mb-6">Guía de ingreso</h2>

    <div class="flex flex-col md:flex-row gap-8">

      <div class="w-full md:w-1/3">
        <ul id="lista-pasos" class="space-y-4">
          <!-- ESPACIO DINÁMICO: guia.js inserta la lista de pasos aquí -->
        </ul>
      </div>

      <div class="flex-1 bg-white p-8 rounded-xl shadow-sm relative">

        <!-- ESPACIO DINÁMICO: guia.js inserta aquí el video del paso seleccionado -->
        <div id="video-paso" class="w-full h-64 bg-gray-200 rounded-lg mb-6 flex items-center justify-center text-4xl text-gray-400">
          ▶️
        </div>

        <h3 id="titulo-paso" class="text-xl font-bold mb-2">Cargando...</h3>

        <p id="descripcion-paso" class="text-gray-600 mb-4"></p>

        <ul id="requisitos-paso" class="list-disc pl-5 mb-8 text-gray-600">
          <!-- ESPACIO DINÁMICO -->
        </ul>

        <button class="bg-blue-900 text-white px-6 py-2 rounded-lg font-medium">
          Siguiente paso →
        </button>

        <div class="mt-12">
          <div class="flex justify-between text-xs text-gray-500 mb-1">
            <span>Tu progreso</span>
            <span id="progreso-texto">0%</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2">
            <div id="progreso-barra-guia" class="bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script type="module" src="./js/header.js"></script>
  <script type="module" src="./js/guia.js"></script>
</body>
</html>
