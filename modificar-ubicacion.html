<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal UACJ - Modificar ubicación</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-gray-50">

  <div id="header"></div>

  <main class="p-8 max-w-3xl mx-auto w-full">

    <div class="text-sm text-gray-400 mb-4">
      <a href="./semestre.html" class="hover:text-blue-700">Inicio</a> &gt;
      <a href="./materias.html" class="hover:text-blue-700">Materias</a> &gt; Modificar ubicación
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-8">

      <h2 class="text-3xl font-bold text-blue-900 mb-1">Modificar ubicación de la materia</h2>
      <p class="text-gray-500 mb-8">Selecciona la nueva ubicación para la materia.</p>

      <form id="form-ubicacion">

        <div class="flex flex-col md:flex-row items-stretch md:items-center gap-6 mb-8">

          <div class="flex-1 bg-gray-50 rounded-xl p-5">
            <p class="text-xs text-gray-400 mb-1">Materia</p>
            <p id="texto-materia" class="font-bold text-gray-800 mb-4">Cargando...</p>

            <p class="text-xs text-gray-400 mb-1">Ubicación actual</p>
            <p id="texto-ubicacion-actual" class="text-gray-600">—</p>
          </div>

          <div class="text-2xl text-gray-300 text-center">→</div>

          <div class="flex-1 bg-gray-50 rounded-xl p-5">
            <p class="text-xs text-gray-400 mb-3">Nueva ubicación</p>

            <select
              id="select-edificio"
              class="w-full border border-gray-200 rounded-lg py-2 px-3 mb-3 bg-white"
            >
              <option value="">Selecciona edificio</option>
            </select>

            <select
              id="select-aula"
              class="w-full border border-gray-200 rounded-lg py-2 px-3 bg-white"
              disabled
            >
              <option value="">Selecciona aula</option>
            </select>
          </div>

        </div>

        <div class="flex justify-between items-center">

          <button
            type="button"
            id="btn-eliminar-materia"
            class="text-red-600 text-sm hover:underline"
          >
            Eliminar materia
          </button>

          <div class="flex gap-3">
            <a
              href="./materias.html"
              class="px-6 py-2 rounded-lg font-medium border border-gray-200 text-gray-600 hover:bg-gray-50"
            >
              Cancelar
            </a>
            <button
              type="submit"
              class="bg-blue-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-800 transition"
            >
              Guardar cambios
            </button>
          </div>

        </div>

        <p id="mensaje-ubicacion" class="text-sm mt-4 hidden"></p>

      </form>

    </div>

  </main>

  <script type="module" src="./js/header-semestre.js"></script>
  <script type="module" src="./js/modificar-ubicacion.js"></script>
</body>
</html>
