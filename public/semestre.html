<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal UACJ - Tu primer semestre</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-gray-50">

  <div id="header"></div>

  <main class="p-8 max-w-5xl mx-auto w-full">

    <div class="bg-white rounded-2xl shadow-sm p-8 mb-8">

      <h1 id="titulo-bienvenida" class="text-3xl font-bold text-blue-900 mb-2">
        ¡Bienvenido a tu primer semestre!
      </h1>

      <p class="text-gray-500 mb-6">
        Aquí encontrarás todo lo que necesitas para empezar con el pie derecho.
      </p>

      <div class="flex items-center gap-4">
        <div class="flex-1 bg-gray-200 rounded-full h-3">
          <div id="barra-creditos" class="bg-blue-700 h-3 rounded-full" style="width: 0%"></div>
        </div>
        <span id="texto-creditos" class="text-sm font-medium text-gray-600 whitespace-nowrap">
          0%
        </span>
      </div>

    </div>

    <!-- ACCESOS: espacio dinámico -->
    <div id="accesos-semestre" class="grid grid-cols-2 md:grid-cols-3 gap-6">
      <!-- ESPACIO DINÁMICO: semestre.js inserta las tarjetas aquí -->
    </div>

  </main>

  <script type="module" src="./js/header.js"></script>
  <script type="module" src="./js/semestre.js"></script>
</body>
</html>
