<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal UACJ - Acceso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-gray-50">

  <div class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-md p-10 w-full max-w-md">

      <div class="flex justify-center mb-8">
        <img src="./assets/logo-uacj.png" alt="Logo UACJ" class="h-16 w-auto">
      </div>

      <h1 class="text-2xl font-bold text-center text-blue-900 mb-2">
        Tu primer semestre
      </h1>

      <p class="text-center text-gray-500 mb-8 text-sm">
        Ingresa con la matrícula y contraseña que la universidad ya te asignó.
      </p>

      <form id="form-login" class="space-y-4">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Matrícula</label>
          <input
            type="text"
            id="matricula"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-900"
            placeholder="Ej. 12345678"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-900"
            placeholder="••••••••"
          >
        </div>

        <div id="mensaje-error" class="text-red-600 text-sm hidden"></div>

        <button
          type="submit"
          style="background: var(--primary);"
          class="w-full text-white font-medium py-3 rounded-lg hover:opacity-90 transition"
        >
          Ingresar →
        </button>

      </form>

      <p class="text-center text-gray-400 text-xs mt-8">
        ¿No encuentras tu matrícula? Contacta a servicios escolares.
      </p>

    </div>

  </div>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
