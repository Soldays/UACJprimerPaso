<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal UACJ - Horarios</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-gray-50">

  <div id="header"></div>

  <main class="p-8 max-w-5xl mx-auto w-full">

    <div class="text-sm text-gray-400 mb-4">
      <a href="./semestre.html" class="hover:text-blue-700">Inicio</a> &gt; Horarios
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-8">

      <h2 class="text-3xl font-bold text-blue-900 mb-1">Organiza tu horario</h2>
      <p class="text-gray-500 mb-6">Usa esta plantilla para planear tu semana.</p>

      <div class="flex flex-col md:flex-row gap-8">

        <div class="flex-1 overflow-x-auto">
          <table id="tabla-horario" class="w-full text-sm border-collapse">
            <!-- ESPACIO DINÁMICO: horario.js arma la tabla de horas x días aquí -->
          </table>
        </div>

        <div class="w-full md:w-64 shrink-0">
          <h3 class="font-bold text-gray-800 mb-3">Tips</h3>
          <ul id="lista-tips-horario" class="space-y-3">
            <!-- ESPACIO DINÁMICO: horario.js inserta los tips aquí -->
          </ul>
        </div>

      </div>

      <div id="acciones-materia" class="hidden items-center justify-between bg-blue-50 rounded-lg p-4 mt-6">
        <span id="texto-materia-seleccionada" class="text-sm font-medium text-blue-900"></span>
        <div class="flex gap-3">
          <a
            id="btn-modificar-ubicacion"
            href="#"
            class="px-4 py-2 rounded-lg font-medium border border-blue-900 text-blue-900 hover:bg-blue-100 text-sm"
          >
            Modificar ubicación
          </a>
          <button
            id="btn-eliminar-materia-horario"
            type="button"
            class="px-4 py-2 rounded-lg font-medium border border-red-600 text-red-600 hover:bg-red-50 text-sm"
          >
            Eliminar
          </button>
        </div>
      </div>

      <div class="flex justify-end mt-6">
        <button
          id="btn-descargar-plantilla"
          class="bg-blue-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-800 transition"
        >
          Descargar plantilla ⬇
        </button>
      </div>

    </div>

  </main>

  <script type="module" src="./js/header-semestre.js"></script>
  <script type="module" src="./js/horario.js"></script>
</body>
</html>
